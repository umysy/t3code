name: Fork release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fork release version, for example 0.1.12-fork.1
        required: true
        type: string

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'umysy/t3code'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Expected MAJOR.MINOR.PATCH-fork.N." >&2
            exit 1
          fi

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Build unsigned Windows x64 installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: umysy/t3code
          T3CODE_DESKTOP_OUTPUT_DIR: ${{ github.workspace }}/fork-release
        run: vp run dist:desktop:win:x64

      - name: Upload Windows release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-windows
          if-no-files-found: error
          path: |
            fork-release/*.exe
            fork-release/*.exe.blockmap
            fork-release/latest.yml

  android:
    if: github.repository == 'umysy/t3code'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Expected MAJOR.MINOR.PATCH-fork.N." >&2
            exit 1
          fi
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "FORK_ANDROID_KEYSTORE_BASE64 is missing." >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fork.keystore"
      - name: Prebuild Android
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          T3CODE_MOBILE_VERSION: ${{ inputs.version }}
          EXPO_NO_GIT_STATUS: 1
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
        run: vp exec expo prebuild --platform android --clean --no-install
      - name: Assemble signed APK
        working-directory: apps/mobile/android
        env:
          FORK_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fork.keystore
          FORK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
          FORK_ANDROID_KEY_ALIAS: ${{ secrets.FORK_ANDROID_KEY_ALIAS }}
          FORK_ANDROID_KEY_PASSWORD: ${{ secrets.FORK_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Rename APK and check its signing key
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apk="T3-Code-Fork-$VERSION.apk"
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          # A debug-signed APK cannot update an installed fork release.
          grep -q "CN=T3 Code Fork" <<<"$certs" || { echo "APK is not signed with the fork key." >&2; exit 1; }
      - name: Upload Android release file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-android
          if-no-files-found: error
          path: T3-Code-Fork-${{ inputs.version }}.apk

  release:
    if: github.repository == 'umysy/t3code'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-windows
          path: fork-release
      - name: Download Android release file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-android
          path: fork-release

      - name: Create draft release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "T3 Code Fork $VERSION" \
            --notes "Fork builds based on upstream T3 Code. Windows SmartScreen will warn." \
            fork-release/*.exe fork-release/*.exe.blockmap fork-release/latest.yml fork-release/*.apk
